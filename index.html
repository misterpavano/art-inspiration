<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Art Inspiration Daily — Tuesday, March 3, 2026</title>
  <style>
    :root{--bg:#0d0d0d;--surface:#161616;--surface2:#1e1e1e;--border:#2a2a2a;--accent:#e8c84a;--text:#f0f0f0;--muted:#888;}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--bg);color:var(--text);font-family:'Inter','Helvetica Neue',sans-serif;padding:0 0 80px;}
    header{border-bottom:1px solid var(--border);padding:32px 40px 24px;display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px;}
    .logo{font-size:11px;text-transform:uppercase;letter-spacing:.2em;color:var(--muted);margin-bottom:6px;}
    h1{font-size:clamp(26px,5vw,46px);font-weight:700;letter-spacing:-.03em;line-height:1;}
    h1 span{color:var(--accent);}
    .date-badge{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:8px 14px;font-size:13px;color:var(--muted);white-space:nowrap;}
    .container{max-width:1100px;margin:0 auto;padding:48px 40px 0;}
    .section-label{font-size:10px;text-transform:uppercase;letter-spacing:.25em;color:var(--muted);margin-bottom:20px;display:flex;align-items:center;gap:10px;}
    .section-label::after{content:'';flex:1;height:1px;background:var(--border);}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;margin-bottom:52px;}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:22px;transition:border-color .2s,transform .2s;text-decoration:none;color:inherit;display:block;}
    .card:hover{border-color:var(--accent);transform:translateY(-2px);}
    .card-eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.2em;margin-bottom:8px;}
    .card h3{font-size:15px;font-weight:600;line-height:1.35;margin-bottom:9px;letter-spacing:-.01em;}
    .card p{font-size:13px;line-height:1.65;color:#aaa;}
    .source-link{display:inline-block;margin-top:13px;font-size:11px;color:#38bdf8;text-decoration:none;border-bottom:1px solid transparent;transition:border-color .15s;}
    .source-link:hover{border-color:#38bdf8;}
    .pulse{display:inline-block;width:7px;height:7px;border-radius:50%;background:#4ade80;margin-right:6px;animation:pulse 2s infinite;}
    @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
    footer{text-align:center;margin-top:64px;font-size:12px;color:var(--muted);border-top:1px solid var(--border);padding-top:24px;}
    @media(max-width:600px){header,.container{padding-left:20px;padding-right:20px;}}
  </style>
</head>
<body>
  <header>
    <div>
      <div class="logo">Art Inspiration Daily</div>
      <h1>What's <span>moving</span> right now.</h1>
    </div>
    <div class="date-badge"><span class="pulse"></span> Tuesday, March 3, 2026</div>
  </header>
  <div class="container">
    
  </div>
  <footer>Art Inspiration Daily &nbsp;·&nbsp; Powered by Wally &nbsp;·&nbsp; Refreshed 2026-03-03 &nbsp;·&nbsp; Sources: SearXNG multi-engine search</footer>
</body>
</html>
